name: solo66-weavedesk
services:
  bench:
    build:
      context: .
      args:
        WEAVEDESK_DEPS_IMAGE: ${WEAVEDESK_DEPS_IMAGE:-python:3.11-slim}
    image: ${WEAVEDESK_IMAGE:-solo66-weavedesk:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      WAITRESS_THREADS: 4
    ports:
      - "127.0.0.1:${WEAVEDESK_PORT:-19980}:8000"
    volumes:
      - surface-library:/var/lib/weavedesk
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200"]
      interval: 4s
      timeout: 4s
      retries: 12
volumes:
  surface-library:
